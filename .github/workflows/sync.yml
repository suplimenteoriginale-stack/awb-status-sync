name: Sincronizare statusuri AWB

on:
  schedule:
    - cron: "17 * * * *" # in fiecare ora, la minutul 17 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Doar simulare (nu scrie nimic in Shopify)"
        type: boolean
        default: false
      only_orders:
        description: "Doar aceste comenzi (ex: PRO21122820,PRO21123180) - optional"
        type: string
        default: ""
      lookback_days:
        description: "Cate zile in urma verificam comenzile"
        type: string
        default: "20"

concurrency:
  group: awb-status-sync
  cancel-in-progress: false

permissions:
  contents: write # doar pentru commit-ul lunar care tine programarea activa

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Pastreaza programarea activa
        # GitHub opreste rularile programate dupa 60 de zile fara activitate in repo.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Teste
        run: node --test test/all.test.mjs
      - name: Sincronizare
        env:
          SHOPIFY_SHOP: ${{ vars.SHOPIFY_SHOP || 'provitamine' }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          ONLY_ORDERS: ${{ inputs.only_orders }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '20' }}
          MAX_RUNTIME_MIN: "50"
        run: node src/sync.mjs
